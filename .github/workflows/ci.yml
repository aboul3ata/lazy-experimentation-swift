name: CI
on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
  workflow_dispatch:
jobs:
  apple:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: toolchain
      run: |
        echo "version=$(swift --version | shasum | cut -d " " -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
    - run: swift test
    timeout-minutes: 6
  ios:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: toolchain
      run: |
        echo "version=$(swift --version | shasum | cut -d " " -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
    - run: xcodebuild -scheme LazyExperimentation -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
