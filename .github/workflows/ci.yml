name: CI
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      major_release:
        description: Run major-release validation
        type: boolean
        default: false
  push:
    tags:
    - v*.0.0
jobs:
  apple:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: toolchain
      run: |
        echo "version=$(swift --version | shasum | cut -d " " -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
    - run: swift test
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 10 }}
  ios:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - id: toolchain
      run: |
        echo "version=$(swift --version | shasum | cut -d " " -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
    - run: xcodebuild -scheme LazyExperimentation -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    timeout-minutes: 15
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
      'major-release') || startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
